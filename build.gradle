plugins {
    id 'java-library'
    id 'maven-publish'
}

group = 'io.github.c4x2'
version = '2.4.2'
description = 'Java client SDK for the TinyURL API (OpenAPI v2.4.2)'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    withJavadocJar()
    withSourcesJar()
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.0'
    testImplementation 'org.assertj:assertj-core:3.26.3'
    testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = 'jtinysdk'
            from components.java
            pom {
                name = 'jTinySDK'
                description = 'Java client SDK for the TinyURL API (OpenAPI v2.4.2)'
                url = 'https://github.com/C4X2/jTinySDK'
                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                    }
                }
                developers {
                    developer {
                        id = 'C4X2'
                        name = 'C4X2'
                        url = 'https://github.com/C4X2'
                    }
                }
                scm {
                    connection = 'scm:git:git://github.com/C4X2/jTinySDK.git'
                    developerConnection = 'scm:git:ssh://github.com:C4X2/jTinySDK.git'
                    url = 'https://github.com/C4X2/jTinySDK'
                }
            }
        }
    }
}
